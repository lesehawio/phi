<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>φ فی — دستیار هوشمند</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, sans-serif; }

  html, body {
    height: 100%;
    overflow: hidden;
    background: #000;
    color: #fff;
  }

  /* 🌌 پس‌زمینه‌ی دیجیتال */
  body {
    background:
      radial-gradient(circle at 20% 30%, #1a0f2e 0%, transparent 50%),
      radial-gradient(circle at 80% 70%, #2e1a0f 0%, transparent 50%),
      radial-gradient(circle at 50% 50%, #0f1a2e 0%, #000 80%);
    position: relative;
  }

  /* ✨ شبکه‌ی دیجیتال */
  body::before {
    content: '';
    position: absolute;
    inset: 0;
    background-image:
      linear-gradient(rgba(255, 215, 0, 0.06) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255, 215, 0, 0.06) 1px, transparent 1px);
    background-size: 40px 40px;
    animation: gridMove 20s linear infinite;
    pointer-events: none;
  }

  @keyframes gridMove {
    0%   { background-position: 0 0; }
    100% { background-position: 40px 40px; }
  }

  /* 🎇 ذرات شناور */
  .particles {
    position: absolute;
    inset: 0;
    pointer-events: none;
    overflow: hidden;
  }
  .particle {
    position: absolute;
    width: 2px; height: 2px;
    background: #ffd700;
    border-radius: 50%;
    box-shadow: 0 0 6px #ffd700;
    animation: float 8s infinite ease-in-out;
  }

  @keyframes float {
    0%   { transform: translateY(0) scale(1); opacity: 0; }
    50%  { opacity: 1; }
    100% { transform: translateY(-100vh) scale(0.3); opacity: 0; }
  }

  /* 📦 کانتینر اصلی */
  .container {
    position: relative;
    z-index: 10;
    height: 100vh;
    max-width: 500px;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    padding: 20px;
  }

  /* 🔮 هدر با نماد φ */
  .header {
    text-align: center;
    padding: 10px 0 20px;
  }

  .phi-symbol {
    font-size: 90px;
    font-weight: 300;
    background: linear-gradient(135deg, #ffd700, #ff8c00, #ffd700);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    filter: drop-shadow(0 0 25px rgba(255, 215, 0, 0.7));
    animation: phiGlow 3s ease-in-out infinite;
    font-family: 'Times New Roman', serif;
  }

  @keyframes phiGlow {
    0%, 100% { filter: drop-shadow(0 0 20px rgba(255, 215, 0, 0.5)); transform: scale(1); }
    50%      { filter: drop-shadow(0 0 45px rgba(255, 215, 0, 1)); transform: scale(1.05); }
  }

  .phi-title {
    font-size: 14px;
    letter-spacing: 8px;
    color: #ffd700;
    opacity: 0.8;
    margin-top: -10px;
  }

  .phi-subtitle {
    font-size: 11px;
    color: #888;
    letter-spacing: 3px;
    margin-top: 8px;
  }

  /* 📜 کادر پیام‌ها */
  .messages {
    flex: 1;
    overflow-y: auto;
    padding: 15px;
    background: rgba(10, 10, 20, 0.6);
    border: 1px solid rgba(255, 215, 0, 0.2);
    border-radius: 15px;
    backdrop-filter: blur(10px);
    margin-bottom: 15px;
    display: flex;
    flex-direction: column;
    gap: 10px;
    scroll-behavior: smooth;
  }

  .messages::-webkit-scrollbar { width: 4px; }
  .messages::-webkit-scrollbar-track { background: transparent; }
  .messages::-webkit-scrollbar-thumb { background: #ffd700; border-radius: 10px; }

  .msg {
    padding: 10px 14px;
    border-radius: 12px;
    font-size: 13px;
    line-height: 1.6;
    max-width: 85%;
    animation: msgIn 0.4s ease;
    word-wrap: break-word;
  }

  @keyframes msgIn {
    from { opacity: 0; transform: translateY(10px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .msg.user {
    align-self: flex-start;
    background: linear-gradient(135deg, rgba(255, 215, 0, 0.15), rgba(255, 140, 0, 0.1));
    border: 1px solid rgba(255, 215, 0, 0.4);
    color: #ffd700;
  }

  .msg.bot {
    align-self: flex-end;
    background: rgba(30, 30, 50, 0.8);
    border: 1px solid rgba(100, 200, 255, 0.3);
    color: #a0d8ff;
  }

  /* 🎛️ نوار پایین */
  .controls {
    display: flex;
    gap: 10px;
    align-items: center;
  }

  .input-box {
    flex: 1;
    padding: 14px 18px;
    background: rgba(10, 10, 20, 0.8);
    border: 1px solid rgba(255, 215, 0, 0.3);
    border-radius: 30px;
    color: #fff;
    font-size: 14px;
    outline: none;
    transition: 0.3s;
  }

  .input-box:focus {
    border-color: #ffd700;
    box-shadow: 0 0 20px rgba(255, 215, 0, 0.4);
  }

  .input-box::placeholder { color: #666; }

  /* 🎤 دکمه‌ی بزرگ ضبط صدا */
  .mic-btn {
    width: 70px;
    height: 70px;
    border-radius: 50%;
    border: 2px solid #ffd700;
    background: radial-gradient(circle, rgba(255, 215, 0, 0.2), rgba(255, 140, 0, 0.05));
    color: #ffd700;
    font-size: 28px;
    cursor: pointer;
    transition: 0.3s;
    display: flex;
    justify-content: center;
    align-items: center;
    box-shadow: 0 0 20px rgba(255, 215, 0, 0.3);
    flex-shrink: 0;
  }

  .mic-btn:hover {
    transform: scale(1.05);
    box-shadow: 0 0 35px rgba(255, 215, 0, 0.6);
  }

  .mic-btn.listening {
    background: radial-gradient(circle, rgba(255, 0, 80, 0.5), rgba(255, 100, 0, 0.2));
    border-color: #ff0050;
    color: #fff;
    animation: micPulse 1s infinite;
    box-shadow: 0 0 40px rgba(255, 0, 80, 0.8);
  }

  @keyframes micPulse {
    0%, 100% { transform: scale(1); }
    50%      { transform: scale(1.15); }
  }

  /* 📱 رسپانسیو */
  @media (max-width: 500px) {
    .phi-symbol { font-size: 70px; }
    .mic-btn { width: 60px; height: 60px; font-size: 24px; }
  }
</style>
</head>
<body>

<!-- 🎇 ذرات -->
<div class="particles" id="particles"></div>

<div class="container">

  <!-- 🔮 هدر -->
  <div class="header">
    <div class="phi-symbol">φ</div>
    <div class="phi-title">P H I</div>
    <div class="phi-subtitle">۱.۶۱۸ · نسبت طلایی</div>
  </div>

  <!-- 📜 کادر پیام‌ها -->
  <div class="messages" id="messages">
    <div class="msg bot">سلام 👋 من فی هستم. اسم یه برنامه رو بگو تا بازش کنم.</div>
  </div>

  <!-- 🎛️ کنترل‌ها -->
  <div class="controls">
    <input type="text" class="input-box" id="inputBox" placeholder="مثلاً: یوتیوب رو باز کن" />
    <button class="mic-btn" id="micBtn">🎤</button>
  </div>

</div>

<script>
  // 🎇 ساخت ذرات
  const particlesContainer = document.getElementById('particles');
  for (let i = 0; i < 40; i++) {
    const p = document.createElement('div');
    p.className = 'particle';
    p.style.left = Math.random() * 100 + '%';
    p.style.top = Math.random() * 100 + '%';
    p.style.animationDelay = Math.random() * 8 + 's';
    p.style.animationDuration = (5 + Math.random() * 6) + 's';
    particlesContainer.appendChild(p);
  }

  // 🗂️ اپ‌ها
  // package = نام بسته‌ی اندروید برای اجرای مستقیم اپ نصب‌شده
  const apps = {
    chrome: {
      name: 'Chrome', icon: '🌐', color: '#4285F4',
      package: 'com.android.chrome',
      fallback: 'https://www.google.com'
    },

    messages: {
      name: 'Messages', icon: '💬', color: '#00C853',
      scheme: 'sms:',
      fallback: 'sms:'
    },

    phone: {
      name: 'Phone', icon: '📞', color: '#00BFA5',
      scheme: 'tel:',
      fallback: 'tel:'
    },

    eitaa: {
      name: 'Eitaa', icon: '🟢', color: '#4CAF50',
      package: 'ir.eitaa.messenger',
      fallback: 'https://eitaa.com'
    },

    youtube: {
      name: 'YouTube', icon: '▶️', color: '#FF0000',
      package: 'com.google.android.youtube',
      fallback: 'https://www.youtube.com'
    },

    instagram: {
      name: 'Instagram', icon: '📷', color: '#E1306C',
      package: 'com.instagram.android',
      fallback: 'https://www.instagram.com'
    },

    pinterest: {
      name: 'Pinterest', icon: '📌', color: '#E60023',
      package: 'com.pinterest',
      fallback: 'https://www.pinterest.com'
    },

    camera: {
      name: 'Camera', icon: '📸', color: '#FF9800',
      action: 'android.media.action.IMAGE_CAPTURE',
      fallback: 'camera:'
    },

    gallery: {
      name: 'Gallery', icon: '🖼️', color: '#9C27B0',
      action: 'android.intent.action.PICK',
      type: 'image/*',
      fallback: 'content://media/external/images/media'
    }
  };

  const keywords = {
    chrome:    ['کروم', 'chrome', 'مرورگر', 'گوگل'],
    messages:  ['پیام‌رسان', 'پیام رسان', 'messages', 'sms', 'پیام'],
    phone:     ['تماس', 'phone', 'تلفن', 'زنگ'],
    eitaa:     ['ایتا', 'eitaa'],
    youtube:   ['یوتیوب', 'youtube', 'یوتوب'],
    instagram: ['اینستاگرام', 'instagram', 'اینستا', 'insta'],
    pinterest: ['پینترست', 'pinterest', 'پینتر'],
    camera:    ['دوربین', 'camera'],
    gallery:   ['گالری', 'gallery', 'تصاویر', 'عکس‌ها']
  };

  const messagesBox = document.getElementById('messages');
  const inputBox = document.getElementById('inputBox');
  const micBtn = document.getElementById('micBtn');

  // 📩 افزودن پیام
  function addMessage(text, sender) {
    const div = document.createElement('div');
    div.className = 'msg ' + sender;
    div.textContent = text;
    messagesBox.appendChild(div);
    messagesBox.scrollTop = messagesBox.scrollHeight;
  }

  // 🔍 پیدا کردن اپ
  function findApp(text) {
    const lower = text.toLowerCase();
    for (const key in keywords) {
      if (keywords[key].some(k => lower.includes(k.toLowerCase()))) return key;
    }
    return null;
  }

  // 🧭 ساخت Android Intent URI
  function buildIntent(app) {
    let intent = 'intent://#Intent;';

    if (app.action) {
      intent += `action=${app.action};`;
    } else {
      intent += 'action=android.intent.action.MAIN;';
      intent += 'category=android.intent.category.LAUNCHER;';
    }

    if (app.package) {
      intent += `package=${app.package};`;
    }

    if (app.type) {
      intent += `type=${app.type};`;
    }

    intent += 'end';
    return intent;
  }

  // 🚀 اجرای اپ واقعی اندروید
  function launchAndroidApp(app) {
    let leftPhi = false;

    const markLeft = () => {
      leftPhi = true;
    };

    window.addEventListener('blur', markLeft, { once: true });
    document.addEventListener('visibilitychange', () => {
      if (document.hidden) leftPhi = true;
    }, { once: true });

    try {
      if (app.scheme) {
        window.location.href = app.scheme;
      } else {
        // AppMint + Deep Linking باید این Intent را به Android تحویل دهد.
        window.location.href = buildIntent(app);
      }
    } catch (error) {
      console.error('Phi launch error:', error);
    }

    // اگر اپ نصب نباشد یا Intent توسط WebView رد شود، fallback اجرا می‌شود.
    setTimeout(() => {
      if (!leftPhi && app.fallback) {
        window.location.href = app.fallback;
      }
    }, 1600);
  }

  // 🚀 باز کردن اپ
  function openApp(key) {
    const app = apps[key];
    if (!app) return;

    addMessage(`در حال باز کردن ${app.name}...`, 'bot');

    // اجرای Intent را مستقیم انجام می‌دهیم تا WebView آن را به Android تحویل دهد.
    launchAndroidApp(app);

    setTimeout(() => {
      addMessage(`✅ درخواست باز کردن ${app.name} ارسال شد.`, 'bot');
    }, 500);
  }

  // ✍️ پردازش ورودی
  function handleInput(text) {
    if (!text.trim()) return;
    addMessage(text, 'user');
    const key = findApp(text);
    if (key) {
      openApp(key);
    } else {
      addMessage('متوجه نشدم. مثلاً بگو: «یوتیوب رو باز کن».', 'bot');
    }
    inputBox.value = '';
  }

  // ⏎ اینتر
  inputBox.addEventListener('keypress', (e) => {
    if (e.key === 'Enter') handleInput(inputBox.value);
  });

  // 🎤 ضبط صدا
  const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (SpeechRecognition) {
    const recognition = new SpeechRecognition();
    recognition.lang = 'fa-IR';
    recognition.continuous = false;

    micBtn.onclick = () => {
      recognition.start();
      micBtn.classList.add('listening');
      micBtn.textContent = '⏺';
      addMessage('🎤 در حال گوش دادن...', 'bot');
    };

    recognition.onresult = (e) => {
      micBtn.classList.remove('listening');
      micBtn.textContent = '🎤';
      handleInput(e.results[0][0].transcript);
    };

    recognition.onerror = () => {
      micBtn.classList.remove('listening');
      micBtn.textContent = '🎤';
      addMessage('نتونستم صدا رو بشنوم. دوباره امتحان کن.', 'bot');
    };

    recognition.onend = () => {
      micBtn.classList.remove('listening');
      micBtn.textContent = '🎤';
    };
  } else {
    micBtn.onclick = () => addMessage('مرورگر تو از تشخیص صدا پشتیبانی نمی‌کنه.', 'bot');
  }
</script>

</body>
</html>
