<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>φ فی — دستیار هوشمند</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, sans-serif; }

  html, body {
    height: 100%;
    overflow: hidden;
    background: #000;
    color: #fff;
  }

  /* 🌌 پس‌زمینه‌ی دیجیتال */
  body {
    background:
      radial-gradient(circle at 20% 30%, #1a0f2e 0%, transparent 50%),
      radial-gradient(circle at 80% 70%, #2e1a0f 0%, transparent 50%),
      radial-gradient(circle at 50% 50%, #0f1a2e 0%, #000 80%);
    position: relative;
  }

  /* ✨ شبکه‌ی دیجیتال */
  body::before {
    content: '';
    position: absolute;
    inset: 0;
    background-image:
      linear-gradient(rgba(255, 215, 0, 0.06) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255, 215, 0, 0.06) 1px, transparent 1px);
    background-size: 40px 40px;
    animation: gridMove 20s linear infinite;
    pointer-events: none;
  }

  @keyframes gridMove {
    0%   { background-position: 0 0; }
    100% { background-position: 40px 40px; }
  }

  /* 🎇 ذرات شناور */
  .particles {
    position: absolute;
    inset: 0;
    pointer-events: none;
    overflow: hidden;
  }
  .particle {
    position: absolute;
    width: 2px; height: 2px;
    background: #ffd700;
    border-radius: 50%;
    box-shadow: 0 0 6px #ffd700;
    animation: float 8s infinite ease-in-out;
  }

  @keyframes float {
    0%   { transform: translateY(0) scale(1); opacity: 0; }
    50%  { opacity: 1; }
    100% { transform: translateY(-100vh) scale(0.3); opacity: 0; }
  }

  /* 📦 کانتینر اصلی */
  .container {
    position: relative;
    z-index: 10;
    height: 100vh;
    max-width: 500px;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    padding: 20px;
  }

  /* 🔮 هدر با نماد φ */
  .header {
    text-align: center;
    padding: 10px 0 20px;
  }

  .phi-symbol {
    font-size: 90px;
    font-weight: 300;
    background: linear-gradient(135deg, #ffd700, #ff8c00, #ffd700);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    filter: drop-shadow(0 0 25px rgba(255, 215, 0, 0.7));
    animation: phiGlow 3s ease-in-out infinite;
    font-family: 'Times New Roman', serif;
  }

  @keyframes phiGlow {
    0%, 100% { filter: drop-shadow(0 0 20px rgba(255, 215, 0, 0.5)); transform: scale(1); }
    50%      { filter: drop-shadow(0 0 45px rgba(255, 215, 0, 1)); transform: scale(1.05); }
  }

  .phi-title {
    font-size: 14px;
    letter-spacing: 8px;
    color: #ffd700;
    opacity: 0.8;
    margin-top: -10px;
  }

  .phi-subtitle {
    font-size: 11px;
    color: #888;
    letter-spacing: 3px;
    margin-top: 8px;
  }

  /* 📜 کادر پیام‌ها */
  .messages {
    flex: 1;
    overflow-y: auto;
    padding: 15px;
    background: rgba(10, 10, 20, 0.6);
    border: 1px solid rgba(255, 215, 0, 0.2);
    border-radius: 15px;
    backdrop-filter: blur(10px);
    margin-bottom: 15px;
    display: flex;
    flex-direction: column;
    gap: 10px;
    scroll-behavior: smooth;
  }

  .messages::-webkit-scrollbar { width: 4px; }
  .messages::-webkit-scrollbar-track { background: transparent; }
  .messages::-webkit-scrollbar-thumb { background: #ffd700; border-radius: 10px; }

  .msg {
    padding: 10px 14px;
    border-radius: 12px;
    font-size: 13px;
    line-height: 1.6;
    max-width: 85%;
    animation: msgIn 0.4s ease;
    word-wrap: break-word;
  }

  @keyframes msgIn {
    from { opacity: 0; transform: translateY(10px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .msg.user {
    align-self: flex-start;
    background: linear-gradient(135deg, rgba(255, 215, 0, 0.15), rgba(255, 140, 0, 0.1));
    border: 1px solid rgba(255, 215, 0, 0.4);
    color: #ffd700;
  }

  .msg.bot {
    align-self: flex-end;
    background: rgba(30, 30, 50, 0.8);
    border: 1px solid rgba(100, 200, 255, 0.3);
    color: #a0d8ff;
  }

  /* 🎛️ نوار پایین */
  .controls {
    display: flex;
    gap: 10px;
    align-items: center;
  }

  .input-box {
    flex: 1;
    padding: 14px 18px;
    background: rgba(10, 10, 20, 0.8);
    border: 1px solid rgba(255, 215, 0, 0.3);
    border-radius: 30px;
    color: #fff;
    font-size: 14px;
    outline: none;
    transition: 0.3s;
  }

  .input-box:focus {
    border-color: #ffd700;
    box-shadow: 0 0 20px rgba(255, 215, 0, 0.4);
  }

  .input-box::placeholder { color: #666; }

  /* 🎤 دکمه‌ی بزرگ ضبط صدا */
  .mic-btn {
    width: 70px;
    height: 70px;
    border-radius: 50%;
    border: 2px solid #ffd700;
    background: radial-gradient(circle, rgba(255, 215, 0, 0.2), rgba(255, 140, 0, 0.05));
    color: #ffd700;
    font-size: 28px;
    cursor: pointer;
    transition: 0.3s;
    display: flex;
    justify-content: center;
    align-items: center;
    box-shadow: 0 0 20px rgba(255, 215, 0, 0.3);
    flex-shrink: 0;
  }

  .mic-btn:hover {
    transform: scale(1.05);
    box-shadow: 0 0 35px rgba(255, 215, 0, 0.6);
  }

  .mic-btn.listening {
    background: radial-gradient(circle, rgba(255, 0, 80, 0.5), rgba(255, 100, 0, 0.2));
    border-color: #ff0050;
    color: #fff;
    animation: micPulse 1s infinite;
    box-shadow: 0 0 40px rgba(255, 0, 80, 0.8);
  }

  @keyframes micPulse {
    0%, 100% { transform: scale(1); }
    50%      { transform: scale(1.15); }
  }

  /* 📱 رسپانسیو */
  @media (max-width: 500px) {
    .phi-symbol { font-size: 70px; }
    .mic-btn { width: 60px; height: 60px; font-size: 24px; }
  }
</style>
</head>
<body>

<!-- 🎇 ذرات -->
<div class="particles" id="particles"></div>

<div class="container">

  <!-- 🔮 هدر -->
  <div class="header">
    <div class="phi-symbol">φ</div>
    <div class="phi-title">P H I</div>
    <div class="phi-subtitle">۱.۶۱۸ · نسبت طلایی</div>
  </div>

  <!-- 📜 کادر پیام‌ها -->
  <div class="messages" id="messages">
    <div class="msg bot">سلام 👋 من فی هستم. اسم یه برنامه رو بگو تا بازش کنم.</div>
  </div>

  <!-- 🎛️ کنترل‌ها -->
  <div class="controls">
    <input type="text" class="input-box" id="inputBox" placeholder="مثلاً: یوتیوب رو باز کن" />
    <button class="mic-btn" id="micBtn">🎤</button>
  </div>

</div>

<script>
  // 🎇 ساخت ذرات
  const particlesContainer = document.getElementById('particles');
  for (let i = 0; i < 40; i++) {
    const p = document.createElement('div');
    p.className = 'particle';
    p.style.left = Math.random() * 100 + '%';
    p.style.top = Math.random() * 100 + '%';
    p.style.animationDelay = Math.random() * 8 + 's';
    p.style.animationDuration = (5 + Math.random() * 6) + 's';
    particlesContainer.appendChild(p);
  }

  // 🗂️ اپ‌های نصب‌شده — Phi App Launcher
  // package باید همان Application ID / Package Name اپ اندرویدی باشد.
  const apps = {
    zi: {
      name: 'Zi',
      package: 'zi.github.io',
      aliases: ['زی', 'zi', 'زی پلاس'] ,
      fallback: 'https://lesehawio.github.io/zi/'
    },
    shifo: {
      name: 'Shifo',
      package: 'shifo.github.io',
      aliases: ['شیفو', 'shifo'],
      fallback: 'https://lesehawio.github.io/shifo/'
    },
    quizly: {
      name: 'Quizly',
      package: 'quizly.github.io',
      aliases: ['کوییزلی', 'quizly', 'کوییز لی'],
      fallback: 'https://lesehawio.github.io/quizly/'
    },
    jib: {
      name: 'Jib',
      package: 'jib.github.io',
      aliases: ['جیب', 'jib'],
      fallback: 'https://lesehawio.github.io/jib/'
    },
    youtube: {
      name: 'YouTube', package: 'com.google.android.youtube',
      aliases: ['یوتیوب', 'یوتوب', 'youtube'], fallback: 'https://www.youtube.com/'
    },
    instagram: {
      name: 'Instagram', package: 'com.instagram.android',
      aliases: ['اینستاگرام', 'اینستا', 'instagram', 'insta'], fallback: 'https://www.instagram.com/'
    },
    chrome: {
      name: 'Chrome', package: 'com.android.chrome',
      aliases: ['کروم', 'chrome', 'گوگل کروم'], fallback: 'https://www.google.com/'
    },
    pinterest: {
      name: 'Pinterest', package: 'com.pinterest',
      aliases: ['پینترست', 'pinterest'], fallback: 'https://www.pinterest.com/'
    },
    eitaa: {
      name: 'Eitaa', package: 'ir.eitaa.messenger',
      aliases: ['ایتا', 'eitaa'], fallback: 'https://eitaa.com/'
    },
    chatgpt: {
      name: 'ChatGPT', package: 'com.openai.chatgpt',
      aliases: ['چت جی پی تی', 'چت‌جی‌پی‌تی', 'chatgpt', 'chat gpt'], fallback: 'https://chatgpt.com/'
    },
    deepseek: {
      name: 'DeepSeek', package: 'com.deepseek.chat',
      aliases: ['دیپ سیک', 'دیپ‌سیک', 'deepseek'], fallback: 'https://chat.deepseek.com/'
    },
    gemini: {
      name: 'Gemini', package: 'com.google.android.apps.bard',
      aliases: ['جمینای', 'جمنای', 'gemini'], fallback: 'https://gemini.google.com/'
    },
    translate: {
      name: 'Google Translate', package: 'com.google.android.apps.translate',
      aliases: ['مترجم گوگل', 'گوگل ترنسلیت', 'ترجمه گوگل', 'translate'], fallback: 'https://translate.google.com/'
    },
    divar: {
      name: 'Divar', package: 'ir.divar',
      aliases: ['دیوار', 'divar'], fallback: 'https://divar.ir/'
    },
    playstore: {
      name: 'Google Play', package: 'com.android.vending',
      aliases: ['اپ استور', 'پلی استور', 'گوگل پلی', 'play store', 'google play'], fallback: 'https://play.google.com/store'
    },
    contacts: {
      name: 'Contacts', package: 'com.google.android.contacts',
      aliases: ['مخاطبین', 'مخاطب', 'contacts', 'کانتکت'], fallback: 'content://contacts/'
    },
    olvid: {
      name: 'Olvid', package: 'io.olvid.messenger',
      aliases: ['اولوید', 'olvid'], fallback: 'https://olvid.io/'
    },
    camera: {
      name: 'Camera', action: 'android.media.action.IMAGE_CAPTURE',
      aliases: ['دوربین', 'camera'], fallback: 'camera:'
    },
    gallery: {
      name: 'Gallery', action: 'android.intent.action.VIEW', type: 'image/*',
      aliases: ['گالری', 'gallery', 'عکس‌ها', 'تصاویر'], fallback: 'content://media/external/images/media'
    },
    phone: {
      name: 'Phone', scheme: 'tel:',
      aliases: ['تلفن', 'تماس', 'شماره گیر', 'شماره‌گیر', 'phone'], fallback: 'tel:'
    },
    messages: {
      name: 'Messages', scheme: 'sms:',
      aliases: ['پیام ها', 'پیام‌ها', 'پیام رسان', 'پیام‌رسان', 'پیام', 'messages', 'sms'], fallback: 'sms:'
    }
  };

  const messagesBox = document.getElementById('messages');
  const inputBox = document.getElementById('inputBox');
  const micBtn = document.getElementById('micBtn');

  function addMessage(text, sender) {
    const div = document.createElement('div');
    div.className = 'msg ' + sender;
    div.textContent = text;
    messagesBox.appendChild(div);
    messagesBox.scrollTop = messagesBox.scrollHeight;
  }

  function normalizeFa(text) {
    return text.toLowerCase()
      .replace(/[يى]/g, 'ی')
      .replace(/ك/g, 'ک')
      .replace(/[‌]/g, ' ')
      .replace(/\s+/g, ' ')
      .trim();
  }

  function findApp(text) {
    const lower = normalizeFa(text);
    for (const key in apps) {
      if (apps[key].aliases.some(alias => lower.includes(normalizeFa(alias)))) return key;
    }
    return null;
  }

  // ساخت Intent اندروید برای اجرای مستقیم APK نصب‌شده
  function buildAndroidIntent(app) {
    let intent = 'intent://#Intent;';

    if (app.action) {
      intent += 'action=' + app.action + ';';
    } else {
      intent += 'action=android.intent.action.MAIN;';
      intent += 'category=android.intent.category.LAUNCHER;';
    }

    if (app.package) intent += 'package=' + app.package + ';';
    if (app.type) intent += 'type=' + encodeURIComponent(app.type) + ';';
    intent += 'end';
    return intent;
  }

  // تلاش برای استفاده از پل AppMint، اگر نسخه‌ی آن چنین متدی را ارائه کند.
  function tryAppMintBridge(url) {
    try {
      const w = window.WebToApp;
      if (!w) return false;

      const candidates = ['openUrl', 'openURL', 'openExternalUrl', 'openExternalURL', 'launchUrl', 'openLink'];
      for (const name of candidates) {
        if (typeof w[name] === 'function') {
          w[name](url);
          return true;
        }
      }
    } catch (e) {
      console.warn('AppMint bridge:', e);
    }
    return false;
  }

  // اجرای اپ: اول APK، سپس fallback وب فقط در صورت شکست.
  function launchApp(app) {
    const intent = buildAndroidIntent(app);
    let hidden = false;

    const onVisibility = () => { if (document.hidden) hidden = true; };
    document.addEventListener('visibilitychange', onVisibility, { once: true });

    // 1) AppMint bridge در صورت وجود
    const bridgeUsed = tryAppMintBridge(intent);

    // 2) Android Intent URI
    if (!bridgeUsed) {
      try {
        window.location.href = intent;
      } catch (e) {
        console.warn('Intent launch failed:', e);
      }
    }

    // 3) fallback — فقط اگر صفحه از Phi خارج نشده باشد.
    if (app.fallback) {
      setTimeout(() => {
        document.removeEventListener('visibilitychange', onVisibility);
        if (!hidden && !document.hidden) {
          try { window.location.href = app.fallback; } catch (_) {}
        }
      }, 1800);
    }
  }

  function openApp(key) {
    const app = apps[key];
    if (!app) return;
    addMessage(`در حال باز کردن ${app.name}...`, 'bot');
    launchApp(app);
  }

  // ✍️ پردازش ورودی
  function handleInput(text) {
    if (!text.trim()) return;
    addMessage(text, 'user');
    const key = findApp(text);
    if (key) {
      openApp(key);
    } else {
      addMessage('متوجه نشدم. مثلاً بگو: «یوتیوب رو باز کن».', 'bot');
    }
    inputBox.value = '';
  }

  // ⏎ اینتر
  inputBox.addEventListener('keypress', (e) => {
    if (e.key === 'Enter') handleInput(inputBox.value);
  });

  // 🎤 ضبط صدا
  const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (SpeechRecognition) {
    const recognition = new SpeechRecognition();
    recognition.lang = 'fa-IR';
    recognition.continuous = false;

    micBtn.onclick = () => {
      recognition.start();
      micBtn.classList.add('listening');
      micBtn.textContent = '⏺';
      addMessage('🎤 در حال گوش دادن...', 'bot');
    };

    recognition.onresult = (e) => {
      micBtn.classList.remove('listening');
      micBtn.textContent = '🎤';
      handleInput(e.results[0][0].transcript);
    };

    recognition.onerror = () => {
      micBtn.classList.remove('listening');
      micBtn.textContent = '🎤';
      addMessage('نتونستم صدا رو بشنوم. دوباره امتحان کن.', 'bot');
    };

    recognition.onend = () => {
      micBtn.classList.remove('listening');
      micBtn.textContent = '🎤';
    };
  } else {
    micBtn.onclick = () => addMessage('مرورگر تو از تشخیص صدا پشتیبانی نمی‌کنه.', 'bot');
  }
</script>

</body>
</html>
