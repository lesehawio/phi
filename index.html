<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#09090d">
<title>فی | دستیار دیجیتال</title>
<style>
:root{color-scheme:dark;--bg:#050812;--fg:#f3f6ff;--muted:#8794b4;--accent:#9c8cff;--cyan:#5cecff;--line:#273453;--panel:rgba(13,21,40,.9)}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif}body{background:radial-gradient(ellipse at 50% 36%,#1b2750 0%,#0b1022 38%,#050812 78%)}body:before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.22;background-image:linear-gradient(#53658a20 1px,transparent 1px),linear-gradient(90deg,#53658a20 1px,transparent 1px);background-size:38px 38px;mask-image:radial-gradient(ellipse at center,#000 10%,transparent 78%)}body:after{content:"";position:fixed;width:300px;height:300px;left:50%;top:42%;transform:translate(-50%,-50%);border-radius:50%;background:#6e59ff0b;filter:blur(55px);pointer-events:none}
button,input{font:inherit}button{cursor:pointer;touch-action:manipulation}.app{position:relative;z-index:1;height:100dvh;width:min(100%,520px);margin:auto;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:28px 22px calc(26px + env(safe-area-inset-bottom));gap:0}.brand{position:absolute;top:calc(23px + env(safe-area-inset-top));display:flex;align-items:center;gap:9px;font-size:14px;letter-spacing:2px;color:#e8eaff;font-weight:700}.brand:before{content:"";width:7px;height:7px;border-radius:50%;background:var(--cyan);box-shadow:0 0 13px #55e7f3;animation:blink 2s ease-in-out infinite}@keyframes blink{50%{opacity:.45;box-shadow:0 0 4px #55e7f3}}.brand span{font-weight:450;color:#8f9bb8;letter-spacing:1px}.mic-area{display:flex;flex-direction:column;align-items:center;gap:22px;width:100%}.mic{position:relative;width:140px;height:140px;border-radius:50%;border:1px solid #7c8eea99;background:radial-gradient(circle at 35% 25%,#263c68,#111a31 65%,#0a1020);color:#e9edff;display:grid;place-items:center;box-shadow:inset 0 1px 0 #ffffff12,0 0 0 8px #8b7cff09,0 0 0 18px #55e7f306,0 0 52px #6257ff30;transition:transform .22s,border-color .22s,box-shadow .22s}.mic:before,.mic:after{content:"";position:absolute;inset:-11px;border:1px solid #7e8dc844;border-radius:50%;pointer-events:none}.mic:after{inset:-23px;border-color:#55e7f328}.mic svg{width:37px;height:37px;filter:drop-shadow(0 0 9px #a9a0ff44)}.mic:active{transform:scale(.96)}.mic.listening{border-color:var(--cyan);background:linear-gradient(145deg,#25385b,#191d3b);box-shadow:inset 0 1px 0 #ffffff18,0 0 0 9px #55e7f310,0 0 0 19px #8b7cff0b,0 0 65px #55e7f333;animation:pulse 1.5s ease-in-out infinite}.mic.listening:before{border-color:#55e7f35a}.mic.listening:after{border-color:#8b7cff45}@keyframes pulse{50%{box-shadow:inset 0 1px 0 #ffffff18,0 0 0 13px #55e7f30c,0 0 0 25px #8b7cff09,0 0 70px #55e7f344}}
.status{min-height:24px;color:#b4c2e4;font-size:13px;text-align:center;line-height:1.9;letter-spacing:.15px}.status:after{content:"";display:block;width:44px;height:2px;margin:7px auto 0;border-radius:3px;background:linear-gradient(90deg,transparent,var(--cyan),var(--accent),transparent);opacity:.75}.heard{min-height:20px;max-width:90%;font-size:12px;color:#d0d7f0;text-align:center;overflow-wrap:anywhere}.menu{display:none;width:100%;margin-top:30px;max-height:43vh;overflow:auto}.menu.show{display:block;animation:in .22s ease}@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}.menu-title{font-size:12px;color:#8f9bb8;margin:0 0 12px;text-align:center;letter-spacing:.4px}.menu-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.item{min-height:56px;border:1px solid #2d3c60;border-radius:16px;background:linear-gradient(135deg,#182743dd,#0d1527f2);color:#edf3ff;padding:12px;font-size:13px;text-align:center;box-shadow:inset 0 1px 0 #ffffff0c,0 8px 22px #0002;transition:border-color .18s,background .18s,transform .18s}.item:active{transform:scale(.98)}.item:active{border-color:#7c80e8;background:#1c2844}.back{display:block;margin:12px auto 0;border:0;background:transparent;color:#8d9ab7;padding:9px 15px;font-size:12px}.modal-wrap{position:fixed;inset:0;z-index:10;background:#03050bd9;backdrop-filter:blur(12px);display:none;align-items:center;justify-content:center;padding:22px}.modal-wrap.show{display:flex}.modal{width:min(100%,360px);border:1px solid #3a4b72;border-radius:24px;background:linear-gradient(145deg,#182743,#0b1222);padding:23px;box-shadow:0 24px 90px #0009,0 0 35px #5f64dd20}.modal h2{font-size:17px;margin:0 0 8px;letter-spacing:-.2px}.modal p{font-size:12px;color:#9ca9c5;line-height:1.9;margin:0 0 17px}.field{width:100%;height:49px;border-radius:13px;border:1px solid #35415f;background:#090e1b;color:var(--fg);padding:0 13px;outline:none;direction:ltr;text-align:left}.field:focus{border-color:var(--cyan);box-shadow:0 0 0 3px #55e7f312}.modal-actions{display:flex;gap:9px;margin-top:15px}.action{flex:1;min-height:44px;border-radius:13px;border:1px solid #8a82ff;background:linear-gradient(135deg,#a69aff,#6e7dff);color:#090d1b;font-weight:750}.action.secondary{background:transparent;color:#c5cde2;border-color:#35415f}.tiny{display:none}
@media(max-height:650px){.mic{width:108px;height:108px}.mic-area{gap:15px}.menu{margin-top:18px;max-height:40vh}}
</style>
</head>
<body>
<main class="app">
  <div class="brand">φ <span>فی</span></div>
  <section class="mic-area">
    <div style="font-size:10px;letter-spacing:2.5px;color:#7486b4;margin-bottom:2px;opacity:.88">VOICE INTERFACE <span style="color:#5cecff">/ READY</span></div>
    <button id="mic" class="mic" aria-label="شروع فرمان صوتی">
      <svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><rect x="12" y="3" width="8" height="17" rx="4"/><path d="M7 15v2a9 9 0 0 0 18 0v-2M16 26v3M12 29h8"/></svg>
    </button>
    <div id="status" class="status">برای فرمان دادن، میکروفون را لمس کن</div>
    <div id="heard" class="heard"></div>
  </section>
  <section id="menu" class="menu" aria-live="polite">
    <p id="menuTitle" class="menu-title">چه کاری انجام بدم؟</p>
    <div id="menuItems" class="menu-grid"></div>
    <button id="back" class="back">بازگشت به منوی اصلی</button>
  </section>

</main>
<div id="modalWrap" class="modal-wrap" role="dialog" aria-modal="true">
  <form id="modalForm" class="modal">
    <h2 id="modalTitle">شماره تلفن</h2><p id="modalDesc">شماره را وارد کن.</p>
    <input id="modalInput" class="field" autocomplete="off" inputmode="tel" placeholder="مثلاً 09123456789" required>
    <div class="modal-actions"><button class="action" type="submit">ادامه</button><button class="action secondary" id="cancelModal" type="button">لغو</button></div>
  </form>
</div>
<script>
(()=>{
const $=id=>document.getElementById(id), mic=$('mic'), status=$('status'), heard=$('heard'), menu=$('menu'), menuTitle=$('menuTitle'), menuItems=$('menuItems'), modalWrap=$('modalWrap'), modalForm=$('modalForm'), modalInput=$('modalInput');
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;let rec=null,listening=false,mode='main',pendingAction='',lastCommand='',lastMenu='main';
const normalize=s=>(s||'').toLocaleLowerCase('fa-IR').replace(/[يى]/g,'ی').replace(/ك/g,'ک').replace(/‌/g,' ').replace(/[؟?!،,.؛:]/g,' ').replace(/\s+/g,' ').trim();
function say(text,thenListen=false){status.textContent=text;if(!('speechSynthesis'in window)){if(thenListen)listen();return}try{speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(text);u.lang='fa-IR';u.rate=.94;u.onend=()=>{if(thenListen)listen()};speechSynthesis.speak(u)}catch(e){if(thenListen)listen()}}
function showMenu(title,items,kind){lastMenu=kind;mode=kind;menuTitle.textContent=title;menuItems.innerHTML='';items.forEach(item=>{let b=document.createElement('button');b.className='item';b.textContent=item.label;b.onclick=()=>runAction(item.action);menuItems.appendChild(b)});menu.classList.add('show')}
function hideMenu(){menu.classList.remove('show')}
function askInput(title,desc,placeholder,action,inputmode='tel'){pendingAction=action;$('modalTitle').textContent=title;$('modalDesc').textContent=desc;modalInput.placeholder=placeholder;modalInput.value='';modalInput.inputMode=inputmode;modalWrap.classList.add('show');setTimeout(()=>modalInput.focus(),80)}
function closeModal(){modalWrap.classList.remove('show')}
function cleanNumber(s){return (s||'').replace(/[۰-۹]/g,d=>'۰۱۲۳۴۵۶۷۸۹'.indexOf(d)).replace(/[٠-٩]/g,d=>'٠١٢٣٤٥٦٧٨٩'.indexOf(d)).replace(/[^\d+*#]/g,'')}
function dial(number){let n=cleanNumber(number);if(!n){say('شماره معتبر نیست.');return}say('شماره‌گیر را با شماره واردشده باز می‌کنم. برای برقراری تماس، دکمه تماس گوشی را بزن.');setTimeout(()=>{location.href='tel:'+encodeURIComponent(n)},250)}
function sms(number){let n=cleanNumber(number);if(!n){say('شماره معتبر نیست.');return}say('صفحه پیام جدید را برای این شماره باز می‌کنم. متن پیام را آنجا بنویس و خودت ارسال کن.');setTimeout(()=>{location.href='sms:'+encodeURIComponent(n)},250)}
function openContacts(){say('دارم برنامه مخاطبین را باز می‌کنم.');try{location.href='intent://contacts/#Intent;action=android.intent.action.VIEW;end'}catch(e){say('بازکردن مخاطبین به پشتیبانی اندروید در Mine App بستگی دارد.')}}
function runAction(action){hideMenu();switch(action){case 'call-number':askInput('تماس با شماره','شماره‌ای را که می‌خواهی با آن تماس بگیری وارد کن.','09123456789','dial');break;case 'call-contact':openContacts();say('فهرست مخاطبین را باز کردم؛ مخاطب را از آنجا انتخاب کن. انتخاب مستقیم و تماس خودکار به اتصال اندرویدی نیاز دارد.');break;case 'contacts':openContacts();break;case 'sms-number':askInput('پیامک به شماره','شماره گیرنده را وارد کن. سپس برنامه پیام‌ها باز می‌شود.','09123456789','sms');break;case 'sms-contact':openContacts();say('فهرست مخاطبین را باز کردم؛ برای پیامک مستقیم به مخاطب، باید اتصال اندرویدی اضافه شود.');break;case 'messages':try{location.href='sms:';say('دارم برنامه پیام‌ها را باز می‌کنم.')}catch(e){say('بازکردن پیام‌ها به پشتیبانی اندروید بستگی دارد.')}break;case 'main':showMain();break;case 'app-eitaa':openAndroidApp('ir.eitaa.messenger','https://web.eitaa.com/','ایتا');break;case 'app-youtube':openAndroidApp('com.google.android.youtube','https://www.youtube.com/','یوتیوب');break;case 'app-chrome':openAndroidApp('com.android.chrome','https://www.google.com/','کروم');break;case 'app-camera':openCamera();break;case 'app-gallery':openGallery();break;case 'apps':showAppsMenu();break}}
function showMain(){showMenu('چه کاری انجام بدم؟',[{label:'تماس',action:'call-menu'},{label:'پیامک',action:'sms-menu'}],'main')}
function showCallMenu(){showMenu('بخش تماس',[{label:'تماس با شماره',action:'call-number'},{label:'تماس با مخاطب',action:'call-contact'},{label:'بازکردن مخاطبین',action:'contacts'}],'call')}
function showSmsMenu(){showMenu('بخش پیامک',[{label:'پیامک به شماره',action:'sms-number'},{label:'پیامک به مخاطب',action:'sms-contact'},{label:'بازکردن پیام‌ها',action:'messages'}],'sms')}
function processInput(value){let v=(value||'').trim();if(!v)return;lastCommand=v;heard.textContent='«'+v+'»';let c=normalize(v);
 if(c.includes('لغو')||c==='بیخیال'||c==='بی خیال'){closeModal();hideMenu();say('باشه، لغو شد.');return}
 if(/^(سلام|درود)/.test(c)){say('سلام، من فی‌ام. بگو تماس یا پیامک؛ یا بگو چه کاری می‌خوای انجام بدم.',true);return}
 if(c.includes('منو')||c.includes('چه کار')||c==='شروع'){showMain();say('منوی اصلی رو باز کردم.');return}
 if(c.includes('برنامه ها')||c.includes('برنامه‌ها')||c.includes('اپلیکیشن ها')||c.includes('اپلیکیشن‌ها')){showAppsMenu();return}
 if(c.includes('ایتا')){openAndroidApp('ir.eitaa.messenger','https://web.eitaa.com/','ایتا');return}
 if(c.includes('یوتیوب')||c.includes('youtube')){openAndroidApp('com.google.android.youtube','https://www.youtube.com/','یوتیوب');return}
 if(c.includes('کروم')||c.includes('chrome')||c.includes('مرورگر')){openAndroidApp('com.android.chrome','https://www.google.com/','کروم');return}
 if(c.includes('دوربین')||c.includes('عکس بگیر')){openCamera();return}
 if(c.includes('گالری')||c.includes('عکس های من')||c.includes('عکس‌های من')){openGallery();return}
 if(c.includes('پیام')||c.includes('اس ام اس')||c.includes('sms')){showSmsMenu();say('بخش پیامک رو باز کردم.');return}
 if(c.includes('تماس')||c.includes('زنگ')||c.includes('شماره گیر')||c.includes('شماره‌گیر')){showCallMenu();say('بخش تماس رو باز کردم.');return}
 if(c.includes('مخاطب')||c.includes('دفترچه تلفن')){openContacts();return}
 say('متوجه شدم. برای انتخاب دقیق‌تر، بگو «تماس» یا «پیامک».',true)
}
menuItems.addEventListener('click',e=>{let b=e.target.closest('button');if(!b)return;let a=b.dataset.action;if(a==='call-menu'){showCallMenu();return}if(a==='sms-menu'){showSmsMenu();return}});
// Route menu actions through delegated handler so every menu item works.
const originalShowMenu=showMenu;
function showMenu(title,items,kind){lastMenu=kind;mode=kind;menuTitle.textContent=title;menuItems.innerHTML='';items.forEach(item=>{let b=document.createElement('button');b.className='item';b.textContent=item.label;b.dataset.action=item.action;b.onclick=()=>{if(item.action==='call-menu'){showCallMenu()}else if(item.action==='sms-menu'){showSmsMenu()}else runAction(item.action)};menuItems.appendChild(b)});menu.classList.add('show')}
// Rebind the main menu functions to the delegated version.
function showMainFixed(){showMenu('چه کاری انجام بدم؟',[{label:'تماس',action:'call-menu'},{label:'پیامک',action:'sms-menu'},{label:'برنامه‌ها',action:'apps'}],'main')}
function showCallMenuFixed(){showMenu('بخش تماس',[{label:'تماس با شماره',action:'call-number'},{label:'تماس با مخاطب',action:'call-contact'},{label:'بازکردن مخاطبین',action:'contacts'}],'call')}
function showSmsMenuFixed(){showMenu('بخش پیامک',[{label:'پیامک به شماره',action:'sms-number'},{label:'پیامک به مخاطب',action:'sms-contact'},{label:'بازکردن پیام‌ها',action:'messages'}],'sms')}
function openAndroidApp(pkg, fallback, label){
 const fb=encodeURIComponent(fallback||'https://www.google.com');
 const uri='intent://#Intent;package='+pkg+';action=android.intent.action.MAIN;category=android.intent.category.LAUNCHER;S.browser_fallback_url='+fb+';end';
 say('دارم '+label+' رو باز می‌کنم.');
 try{window.location.href=uri}catch(e){if(fallback)window.location.href=fallback;else say('بازکردن این برنامه در این مرورگر پشتیبانی نشد.');}
}
function openCamera(){say('درخواست بازکردن دوربین رو می‌فرستم.');try{window.location.href='intent://#Intent;action=android.media.action.IMAGE_CAPTURE;end'}catch(e){say('بازکردن دوربین به پشتیبانی اندروید در مرورگر بستگی دارد.')}}
function openGallery(){say('انتخاب‌گر عکس‌های گوشی رو باز می‌کنم.');try{window.location.href='intent://#Intent;action=android.intent.action.GET_CONTENT;type=image%2F*;end'}catch(e){say('بازکردن گالری به پشتیبانی اندروید در مرورگر بستگی دارد.')}}
function showAppsMenu(){showMenu('کدام برنامه را باز کنم؟',[{label:'ایتا',action:'app-eitaa'},{label:'یوتیوب',action:'app-youtube'},{label:'کروم',action:'app-chrome'},{label:'دوربین',action:'app-camera'},{label:'گالری',action:'app-gallery'}],'apps');say('منوی برنامه‌ها رو باز کردم.');}
// Use fixed versions for every interaction.
showMain=showMainFixed;showCallMenu=showCallMenuFixed;showSmsMenu=showSmsMenuFixed;
modalForm.addEventListener('submit',e=>{e.preventDefault();let value=modalInput.value.trim();if(!value)return;let action=pendingAction;closeModal();if(action==='dial')dial(value);else if(action==='sms')sms(value);else if(action==='contacts'){say('برای انتخاب مخاطب، فهرست مخاطبین را باز می‌کنم.');openContacts()}});
$('cancelModal').addEventListener('click',()=>{closeModal();say('باشه، لغو شد.')});$('back').addEventListener('click',()=>{showMainFixed();say('به منوی اصلی برگشتیم.')});
async function listen(){if(listening)return;if(!SR){say('تشخیص گفتار در این محیط پشتیبانی نمی‌شود. اگر داخل APK هستی، Mine App باید دسترسی میکروفون و WebView را پشتیبانی کند.');return}try{if(!window.isSecureContext&&location.protocol!=='file:'){say('برای میکروفون، صفحه باید در یک محیط امن HTTPS اجرا شود.');return}if(navigator.mediaDevices&&navigator.mediaDevices.getUserMedia){status.textContent='در حال بررسی دسترسی میکروفون…';const stream=await navigator.mediaDevices.getUserMedia({audio:true});stream.getTracks().forEach(t=>t.stop())}rec=new SR();rec.lang='fa-IR';rec.continuous=false;rec.interimResults=false;rec.maxAlternatives=1;rec.onstart=()=>{listening=true;mic.classList.add('listening');status.textContent='گوش می‌دم…'};rec.onresult=e=>{const t=e.results[0][0].transcript;processInput(t)};rec.onerror=e=>{listening=false;mic.classList.remove('listening');if(e.error==='not-allowed'||e.error==='service-not-allowed'){status.textContent='دسترسی میکروفون مسدود است؛ مجوز سایت یا APK را بررسی کن.'}else if(e.error==='audio-capture'){status.textContent='میکروفون در دسترس نیست؛ مجوز و اتصال میکروفون را بررسی کن.'}else if(e.error==='network'){status.textContent='سرویس تشخیص گفتار به شبکه نیاز دارد یا در دسترس نیست.'}else{status.textContent='صدا تشخیص داده نشد؛ دوباره میکروفون را لمس کن.'}};rec.onend=()=>{listening=false;mic.classList.remove('listening')};rec.start()}catch(e){mic.classList.remove('listening');listening=false;if(e&&e.name==='NotAllowedError'){status.textContent='مجوز میکروفون رد شده؛ از تنظیمات سایت یا برنامه اجازه بده.'}else if(e&&e.name==='NotFoundError'){status.textContent='میکروفونی پیدا نشد.'}else{status.textContent='میکروفون در این محیط فعال نشد؛ اگر APK است، تنظیمات Mine App لازم است.'}}}
mic.addEventListener('click',()=>{if(listening){try{rec.stop()}catch(e){}return}listen()});
// Native intents are best-effort; the host WebView must permit them.
})();
</script>
</body>
</html>
